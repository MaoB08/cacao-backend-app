spring:
  application:
    name: cacao-backend-app

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cacaodb}
    username: ${DB_USER:cacaouser}
    password: ${DB_PASSWORD:cacaopassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:cacaoscan_local_dev_jwt_secret_token_key_2026_min_32_chars}
    accessExpirationMs: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://192.168.101.9:8081,http://192.168.101.4:8081}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${ML_SERVICE_TIMEOUT:30}
    api-key: ${ML_SERVICE_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
